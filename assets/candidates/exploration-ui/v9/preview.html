<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>携帯工房・素材組立</title>
<style>body{margin:0;background:#101a1c;color:#e0e9db;font:15px system-ui}main{max-width:1120px;margin:auto;padding:20px}h1{font-size:22px}canvas{width:100%;display:block;border:1px solid #577063;border-radius:8px}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:16px 0}button{background:#294a40;border:1px solid #84957b;border-radius:5px;color:#fff;padding:10px 18px}input[type=range]{width:280px}p{color:#adc2b6}</style>
<main><h1>携帯工房 — 新素材の開閉確認</h1><canvas id="view" width="1120" height="800"></canvas><nav><button id="toggle" disabled>開く</button><button id="replay" disabled>再生し直す</button><label><input id="slow" type="checkbox">4倍スロー</label><label><input id="reduce" type="checkbox">動きを抑える</label></nav><nav><label>時刻 <input id="scrub" type="range" min="0" max="700" value="0" disabled></label><output id="status">素材を読み込み中</output><button id="sample" disabled>操作開始の確認</button></nav><p>開く700ms／閉じる250ms。Escで閉じる。装備操作・SE・本編接続は未実装。蓋の奥行きは2D投影による試作です。</p></main>
<script src="../v8/motion.js"></script><script src="../v8/effects.js"></script><script src="regions.js"></script><script src="renderer.js"></script><script>
const $=id=>document.getElementById(id);let ms=0,target=0,last=null,clock=0,paused=false,renderer;
$('reduce').checked=matchMedia('(prefers-reduced-motion: reduce)').matches;
async function start(){const images={};await Promise.all(['shell.png','drive-transparent.png','power-transparent.png','content','relic'].map(key=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[key]=im;resolve()};im.onerror=()=>reject(new Error(key+'の読込失敗'));im.src=key==='relic'?'../../../first-workshop/equipment/relics/02.png':key==='content'?'../v6/b-bag.png':key})));
renderer=createWorkshopRenderer($('view').getContext('2d'),images,WorkshopParts,WorkshopMotion,WorkshopEffects);for(const id of ['toggle','replay','scrub'])$(id).disabled=false;requestAnimationFrame(tick)}
function go(t){target=t;paused=false;$('toggle').textContent=t?'閉じる':'開く'}
function tick(now){const dt=last===null?0:Math.min(now-last,100);last=now;if(!paused&&!document.hidden){clock+=dt/($('slow').checked?4:1);if(ms!==target)ms=WorkshopMotion.advance(ms,target,dt,{slow:$('slow').checked,reduced:$('reduce').checked})}const p=renderer.render(ms,paused?ms:clock,{paused,reduced:$('reduce').checked,closing:!paused&&target===0});$('scrub').value=Math.round(ms);$('status').textContent=p.stage+' / '+Math.round(ms)+' ms';$('sample').disabled=!p.ready;requestAnimationFrame(tick)}
$('toggle').onclick=()=>go(target===700?0:700);$('replay').onclick=()=>{ms=0;clock=0;go(700)};$('scrub').oninput=()=>{ms=Number($('scrub').value);paused=true;target=0;$('toggle').textContent='ここから開く'};$('sample').onclick=()=>{$('sample').textContent='操作を受け付けました'};addEventListener('keydown',e=>{if(e.code==='Escape')go(0)});start().catch(e=>{$('status').textContent=e.message});
</script></html>
