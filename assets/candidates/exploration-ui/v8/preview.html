<main><h1>携帯工房を開く — 0.7秒の展開案</h1><p>閉じた蓋 → 留め具の解除 → ヒンジで展開 → 遺物核が起動。歯車で蓋を展開し、エネルギー管が点灯。接続部に起動粒子が散ります。</p>
<div id="viewport"><div id="stage"><div id="case">
<div id="body"></div><div id="content"><img src="../v6/b-bag.png" alt="現行の武器・レリックを配置した内部画面"></div>
<svg id="wires" viewBox="0 0 1120 800"><path pathLength="950" class="wire" d="M509 138H115V698H560"/><path pathLength="950" class="wire" d="M611 138H1005V698H560"/></svg>
<div class="door" id="doorL"><img src="lid.svg" alt="左の蓋"></div><div class="door" id="doorR"><img src="lid.svg" alt="右の蓋"></div>
<div id="catchL" class="catch"></div><div id="catchR" class="catch"></div><div id="core"><div id="gem"></div></div>
<canvas id="effects" width="1120" height="800" aria-hidden="true" style="position:absolute;inset:0;width:1120px;height:800px;pointer-events:none"></canvas><button id="sample" disabled>操作開始の確認</button></div><div id="hint">閉じた携帯工房 ／ 開くボタンで展開</div></div></div>
<nav><button id="toggle">開く</button><button id="replay">最初から再生</button><label><input type="checkbox" id="slow"> 4倍スロー</label><label><input type="checkbox" id="reduce"> 動きを抑える</label><output id="status" aria-live="polite">閉じた状態</output></nav>
<nav><label>時刻 <input type="range" id="scrub" min="0" max="700" value="0"> <output id="time">0 ms</output></label></nav>
<p class="legend">開く700ms／閉じる250ms。500msから確認ボタンが操作可能。途中で開閉を反転できます。Escで閉じる。</p>
<small>構造・タイミングの試作。蓋・留め具・核・導線は独立したSVG/CSS部品、内部は既存カンプ。完成版の描き込み、装備操作、SE、本編接続は未実装。</small></main>
