<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リナ・アクション走行試作</title><style>*{box-sizing:border-box}body{margin:0;background:#15232b;color:#e7eded;font:15px system-ui}main{max-width:1060px;margin:28px auto;padding:0 20px}small{color:#dfbd87;letter-spacing:.12em}h1{font-size:27px;margin:10px 0}p{color:#afc4c8;line-height:1.8}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}button{padding:10px 16px;border:1px solid #68818a;border-radius:6px;background:#2a404b;color:white;font:inherit}button.active{background:#d9b67d;color:#15232b}label{display:flex;gap:7px;align-items:center}canvas{max-width:100%;background:#293d46;border-radius:12px}a{color:#dec18f}</style><main><small>RINA / ACTION RUN STUDY</small><h1>構えを保って、軽快に走る。</h1><p>同じ頭・胴体を使い、短い脚の接地と蹴り出し、胴体の上下動、頭と布の遅れを組み合わせた側面試作。</p><div class="controls"><button id="run" class="active">停止する</button><button id="pause">一時停止</button><button id="step">1/8周期進める</button><button id="flip">左向きにする</button><label>再生速度 <input id="speed" type="range" min="0.2" max="1.4" value="1" step="0.1"></label><label><input id="bob" type="checkbox" checked>上下動</label><label><input id="rig" type="checkbox">関節と接地点</label></div><canvas width="1020" height="570"></canvas><p id="status">素材を読み込み中…</p><p>上段は拡大、下段は全高約56px。背景の流れは接地を比較するための目印です。<br>右向き素材の左右反転を含む側面試作です。前後移動・照準方向を変えた移動・射撃・回避・本編接続は未対応。</p></main><script>
const atlas=new Image();atlas.src='__ATLAS__';const cv=document.querySelector('canvas'),c=cv.getContext('2d');
const rects={head:[30,10,500,575],body:[624,285,330,280],arms:[1065,310,435,215],thigh:[167,625,211,348],shin:[673,631,192,227],boot:[675,848,235,152],scarf:[1080,698,368,159]};let parts={},time=0,phase=0,distance=0,blend=1,running=true,paused=false,flip=false,last=0;
function extract(r){const [x,y,w,h]=r,a=document.createElement('canvas');a.width=w;a.height=h;const ac=a.getContext('2d',{willReadFrequently:true});ac.drawImage(atlas,x,y,w,h,0,0,w,h);let im=ac.getImageData(0,0,w,h),d=im.data,l=w,t=h,rr=0,b=0;for(let j=0;j<h;j++)for(let i=0;i<w;i++){let k=(j*w+i)*4;if(d[k]>d[k+1]*1.8+35&&d[k+2]>d[k+1]*1.8+35)d[k+3]=0;if(d[k+3]>40){l=Math.min(l,i);rr=Math.max(rr,i);t=Math.min(t,j);b=Math.max(b,j)}}ac.putImageData(im,0,0);const out=document.createElement('canvas');out.width=rr-l+1;out.height=b-t+1;out.getContext('2d').drawImage(a,l,t,out.width,out.height,0,0,out.width,out.height);return out}
function part(n,x,y,w,h,px=.5,py=0,r=0){c.save();c.translate(x,y);c.rotate(r);c.drawImage(parts[n],-w*px,-h*py,w,h);c.restore()}
function segment(n,a,b,width){let dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);part(n,a[0],a[1],width,len+1,.5,.07,Math.atan2(-dx,dy))}
function mod(x){return (x%1+1)%1}function lift(ph){return document.querySelector('#bob').checked?(-.25-1.45*Math.cos(4*Math.PI*ph+.8)):0}
function foot(ph,side,m){const p=mod(ph+side*.5),stance=.42;let x,y;if(p<stance){x=6-12*p/stance;y=-2.5}else{let u=(p-stance)/(1-stance);x=-6+12*(u*u*(3-2*u));y=-2.5-6*Math.sin(Math.PI*u)}return [x*m+(side?1.8:-1.8)*(1-m),y*m-2.5*(1-m),p<stance]}
function leg(ph,side,m,hip){const f=foot(ph,side,m),dx=f[0]-hip[0],dy=f[1]-hip[1],len=Math.min(11.599,Math.max(.05,Math.hypot(dx,dy))),theta=Math.atan2(dy,dx),bend=Math.acos(len/11.6),k=[hip[0]+5.8*Math.cos(theta-bend),hip[1]+5.8*Math.sin(theta-bend)];c.save();c.filter=side?'brightness(.78)':'none';segment('thigh',hip,k,4.8);segment('shin',k,f,4.2);part('boot',f[0]-.5,f[1],7,4.3,.35,.42,f[2]?0:-.45*Math.sin(Math.PI*mod(ph+side*.5)));c.restore();if(document.querySelector('#rig').checked){c.strokeStyle=side?'#90dcff':'#ffd982';c.lineWidth=.35;c.beginPath();c.moveTo(...hip);c.lineTo(...k);c.lineTo(f[0],f[1]);c.stroke();c.fillStyle=f[2]?'#70eea4':'#ffc16e';c.beginPath();c.arc(f[0],0,.8,0,7);c.fill()}}
function actor(x,y,scale){let m=blend,b=lift(phase)*m,headLag=(lift(phase-.045)*.6-lift(phase))*m,hip=[0,-10+b];c.save();c.translate(x,y);c.scale(scale*(flip?-1:1),scale);c.fillStyle='#10212870';c.beginPath();c.ellipse(0,1,12,2,0,0,7);c.fill();leg(phase,1,m,hip);leg(phase,0,m,hip);c.save();c.translate(1.3*m,b);c.rotate(.035*m);part('scarf',-5,-23,13,4,1,.4,Math.sin(phase*4*Math.PI-.8)*.12*m);part('body',0,-25,18,17,.5,0);part('arms',-5,-20,24,11,.12,.28,-.035*m);part('head',-2,-23+headLag,30,34,.5,1,-.02*m+Math.sin(phase*2*Math.PI-.4)*.012*m);c.restore();c.restore()}
function label(s,x,y){c.fillStyle='#dce8e8';c.font='15px system-ui';c.textAlign='center';c.fillText(s,x,y)}
function ground(y,scale){c.strokeStyle='#607d88';c.lineWidth=1;c.beginPath();c.moveTo(35,y+2);c.lineTo(985,y+2);c.stroke();let gap=28*scale,offset=(distance*scale)%gap;for(let x=35-offset;x<985;x+=gap){c.fillStyle='#607d8870';c.fillRect(flip?1020-x:x,y+8,12*scale,2)}}
function draw(){c.clearRect(0,0,1020,570);ground(332,4);ground(505,1);actor(485,332,4);actor(485,505,1);label('拡大 ×4 / '+(running?'走行':'停止姿勢'),505,38);label('通常サイズ / 約56px',505,410);label('接地 → 沈み込み → 蹴り出し → 足の回収',505,552)}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(!paused){dt*=Number(document.querySelector('#speed').value);time+=dt;blend+=(Number(running)-blend)*(1-Math.exp(-dt*12));phase+=dt/.42*blend;distance+=dt*(12/(.42*.42))*blend}draw();requestAnimationFrame(frame)}
document.querySelector('#step').onclick=()=>{paused=true;document.querySelector('#pause').textContent='再生';phase+=.125;distance+=12/(.42)*.125;draw()};
document.querySelector('#run').onclick=e=>{running=!running;e.target.textContent=running?'停止する':'走り出す';e.target.classList.toggle('active',running)};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'再生':'一時停止'};document.querySelector('#flip').onclick=e=>{flip=!flip;e.target.textContent=flip?'右向きにする':'左向きにする'};
atlas.decode().then(()=>{for(let [k,r] of Object.entries(rects))parts[k]=extract(r);document.querySelector('#status').textContent='走行周期0.42秒。接地中の足送りと背景速度を同期。銃の向きは保ち、頭の上下動は胴体より抑制。';requestAnimationFrame(frame)}).catch(e=>document.querySelector('#status').textContent='読込失敗: '+e.message);
</script></html>
