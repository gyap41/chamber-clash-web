<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>リナ / 独立パーツ試作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151d24;color:#e8ede9;font:15px system-ui,sans-serif}main{max-width:1050px;margin:36px auto;padding:0 24px}small{color:#dcb776;letter-spacing:.12em}h1{font-size:29px;margin:10px 0}p{color:#aebfbe;line-height:1.8}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0}button,select{background:#27363e;color:#fff;border:1px solid #52666c;padding:10px 18px;border-radius:7px;font:inherit;cursor:pointer}button.active{background:#dcb776;color:#172126}canvas{width:100%;background:#24333a;border:1px solid #3c5058;border-radius:12px}label{display:flex;gap:8px;align-items:center}.foot{font-size:13px}a{color:#e6c387}
</style><main><small>RINA • MOTION STUDY 03</small><h1>2頭身のまま、軽やかに。</h1><p>正面の体型とパーツ動作を比較する試作です。左は現行の立ち絵、右は2頭身を保ち、首の接続をスカーフで隠したリナ。</p><div class="controls"><button data-mode="idle" class="active">待機</button><button data-mode="walk">歩行</button><button id="pause">一時停止</button><label>速度 <input id="speed" type="range" min="0.3" max="1.5" step="0.1" value="1"></label><label><input type="checkbox" id="joints">接続点</label></div><canvas id="stage" width="1000" height="560"></canvas><p id="status">画像を読み込み中…</p><p class="foot">原寸は全高約56px。拡大は構造確認用です。歩行はその場歩き。背面・側面・回避・武器接続と本編での動作は未対応。<br>左の現行素材は静止表示であり、動きの比較対象ではありません。頭の閉眼差分は輪郭差があるため今回は使用していません。</p></main>
<script>
const atlas=new Image(),old=new Image();atlas.src='__ATLAS__';old.src='__OLD__';
const rects={head:[28,12,389,421],body:[475,134,310,270],armL:[935,115,194,290],armR:[118,500,200,285],legL:[548,440,146,367],legR:[974,440,148,369],scarf:[117,896,264,300],hair:[542,919,162,249],blink:[834,813,398,420]};
const parts={};const cv=document.querySelector('canvas'),c=cv.getContext('2d');let mode='idle',paused=false,t=0,last=0,mix=0;
function trim(rect){let [x,y,w,h]=rect;const a=document.createElement('canvas');a.width=w;a.height=h;const ac=a.getContext('2d',{willReadFrequently:true});ac.drawImage(atlas,x,y,w,h,0,0,w,h);let d=ac.getImageData(0,0,w,h).data,minX=w,minY=h,maxX=0,maxY=0;for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(d[(j*w+i)*4+3]>20){minX=Math.min(minX,i);minY=Math.min(minY,j);maxX=Math.max(maxX,i);maxY=Math.max(maxY,j)}const out=document.createElement('canvas');out.width=maxX-minX+1;out.height=maxY-minY+1;out.getContext('2d').drawImage(a,minX,minY,out.width,out.height,0,0,out.width,out.height);return out}
function piece(name,x,y,w,h,pX=.5,pY=0,rot=0){c.save();c.translate(x,y);c.rotate(rot);if(name==='head'){const img=parts[name];c.drawImage(img,0,0,img.width,img.height*.93,-w*pX,-h*pY,w,h*.93)}else c.drawImage(parts[name],-w*pX,-h*pY,w,h);if(document.querySelector('#joints').checked){c.fillStyle='#fb8080';c.beginPath();c.arc(0,0,.6,0,7);c.fill()}c.restore()}
function puppet(x,y,scale,time,m){c.save();c.translate(x,y);c.scale(scale,scale);let ph=time*Math.PI*2/.64,s=Math.sin(ph),l=Math.max(0,s),r=Math.max(0,-s),breath=Math.sin(time*2.4),bob=-Math.abs(s)*.85*m; c.fillStyle='#14242b88';c.beginPath();c.ellipse(0,1,12,2,0,0,7);c.fill();
// Hip overlap stays hidden beneath the jacket; the support foot remains at y=0.
piece('legL',-4.0,-11-l*1.8*m,6.5,11,.5,0,-.045*s*m);piece('legR',4.0,-11-r*1.8*m,6.5,11,.5,0,-.045*s*m);
c.save();c.translate(s*.65*m,bob+breath*.20*(1-m));c.rotate(s*.025*m);
piece('scarf',2,-23,8,12,.18,.08,.20+Math.sin(ph-.9)*.15*m+Math.sin(time*2.4-.6)*.05);
piece('armL',-8,-23,7,12,.74,.12,s*.20*m-.06);piece('armR',8,-23,7,12,.26,.12,s*.20*m+.06);
piece('body',0,-25,20,17,.5,0,breath*.008*(1-m));
piece('head',Math.sin(ph-.45)*.28*m,-22,33,34,.5,1,-Math.sin(ph-.45)*.025*m+Math.sin(time*1.4)*.015*(1-m));
c.restore();c.restore()}
function text(str,x,y,size=15,col='#c7d6d6'){c.fillStyle=col;c.font=`${size}px system-ui`;c.textAlign='center';c.fillText(str,x,y)}
function draw(){c.clearRect(0,0,1000,560);c.strokeStyle='#496068';c.beginPath();c.moveTo(40,345);c.lineTo(960,345);c.stroke();text('現行の立ち姿',250,48,20);text('2頭身・独立パーツ試作',730,48,20,'#efcf96');c.save();c.translate(250,344);c.scale(4,4);c.drawImage(old,-32,-60,64,64);c.restore();puppet(730,344,4,t,mix);text('拡大 ×4',500,380,13);text('通常サイズ / 約56px',500,422,14);c.drawImage(old,218,443,64,64);puppet(730,503,1,t,mix);text('頭・胴体・腕・脚・スカーフを独立制御',730,539,13);}
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(!paused){t+=dt*Number(document.querySelector('#speed').value);mix+=(Number(mode==='walk')-mix)*(1-Math.exp(-dt*10))}draw();requestAnimationFrame(frame)}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(v=>v.classList.toggle('active',v===b))});document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'再生':'一時停止'};
Promise.all([atlas.decode(),old.decode()]).then(()=>{for(const [k,r]of Object.entries(rects))parts[k]=trim(r);document.querySelector('#status').textContent='待機：呼吸と重心の揺れ ／ 歩行：交互の足上げ・腕振り・頭と布の遅れ';window.rinaReview={render:(time,m)=>{t=time;mix=m;paused=true;draw()},rects,parts,atlasSize:[atlas.width,atlas.height]};requestAnimationFrame(frame)}).catch(e=>document.querySelector('#status').textContent='画像の読み込みに失敗しました: '+e.message);
</script></html>
