<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>リナ・参考動画モーション</title><style>*{box-sizing:border-box}body{margin:0;background:#15232b;color:#e7eded;font:15px system-ui}main{max-width:1060px;margin:28px auto;padding:0 20px}small{color:#dfbd87;letter-spacing:.12em}h1{font-size:27px;margin:10px 0}p{color:#afc4c8;line-height:1.8}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}button{padding:10px 16px;border:1px solid #68818a;border-radius:6px;background:#2a404b;color:white;font:inherit}button.active{background:#d9b67d;color:#15232b}label{display:flex;gap:7px;align-items:center}canvas{max-width:100%;background:#293d46;border-radius:12px}a{color:#dec18f}</style><main><small>RINA / AIM + MOVEMENT</small><h1>移動と照準を、別々に動かす。</h1><p>参考動画の横移動・後退・構え直しを基準にした試作。自動デモ、またはWASD／矢印キーで移動し、画面上のポインターで左右の構えを変えられます。</p><div class="controls"><button id="demo" class="active">自動デモ：ON</button><button id="pause">一時停止</button><button id="step">1/8周期進める</button><label>速度 <input id="speed" type="range" min="0.2" max="1.2" value="1" step="0.1"></label><label><input id="bob" type="checkbox" checked>上下動</label><label><input id="rig" type="checkbox">関節</label><button id="reset">中央へ戻す</button><label>確認場面 <select id="scene"><option value="0">右移動・右照準</option><option value="1">右移動・左照準</option><option value="2">下移動・左照準</option><option value="4">左移動・右照準</option><option value="5">上移動・右照準</option></select></label></div><canvas width="1020" height="640" tabindex="0" aria-label="移動プレビュー。WASDまたは矢印キーで操作"></canvas><p id="status">素材を読み込み中…</p><p>上段は約56pxのキャラクターが移動する確認エリア。下段は現在の姿勢を3倍で表示。青線は移動方向、金色の目印は構える方向です。<br>左右の側面素材で、移動と構えを独立させた試作です。正面・背面の構え、自由角度の銃口、射撃・回避、本編接続は未対応です。</p></main><script>
const atlas=new Image();atlas.src='__ATLAS__';const cv=document.querySelector('canvas'),c=cv.getContext('2d');
const rects={head:[30,10,500,575],body:[624,285,330,280],arms:[1065,310,435,215],thigh:[167,625,211,348],shin:[673,631,192,227],boot:[675,848,235,152],scarf:[1080,698,368,159]};let parts={},time=0,phase=0,distance=0,blend=1,running=true,paused=false,flip=false,last=0;
let demo=true,moveX=1,moveY=0,pos={x:360,y:205},pointer={x:780,y:205},keys=new Set(),demoStage=0;
function extract(r){const [x,y,w,h]=r,a=document.createElement('canvas');a.width=w;a.height=h;const ac=a.getContext('2d',{willReadFrequently:true});ac.drawImage(atlas,x,y,w,h,0,0,w,h);let im=ac.getImageData(0,0,w,h),d=im.data,l=w,t=h,rr=0,b=0;for(let j=0;j<h;j++)for(let i=0;i<w;i++){let k=(j*w+i)*4;if(d[k]>d[k+1]*1.8+35&&d[k+2]>d[k+1]*1.8+35)d[k+3]=0;if(d[k+3]>40){l=Math.min(l,i);rr=Math.max(rr,i);t=Math.min(t,j);b=Math.max(b,j)}}ac.putImageData(im,0,0);const out=document.createElement('canvas');out.width=rr-l+1;out.height=b-t+1;out.getContext('2d').drawImage(a,l,t,out.width,out.height,0,0,out.width,out.height);return out}
function part(n,x,y,w,h,px=.5,py=0,r=0){c.save();c.translate(x,y);c.rotate(r);c.drawImage(parts[n],-w*px,-h*py,w,h);c.restore()}
function segment(n,a,b,width){let dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);part(n,a[0],a[1],width,len+1,.5,.07,Math.atan2(-dx,dy))}
function mod(x){return (x%1+1)%1}function lift(ph){return document.querySelector('#bob').checked?(-.1-.65*Math.cos(4*Math.PI*ph+.8)):0}
function foot(ph,side,m){const p=mod(ph+side*.5),stance=.50;let travel,up;if(p<stance){travel=5-10*p/stance;up=0}else{let u=(p-stance)/(1-stance);travel=-5+10*u*u*u*(u*(u*6-15)+10);up=1.8*Math.sin(Math.PI*u)**2}const localX=moveX*(flip?-1:1);return [(travel*localX+(side?-.65:.65))*m+(side?1.8:-1.8)*(1-m),-2.5+(travel*moveY-up)*m,p<stance]}
function leg(ph,side,m,hip){const f=foot(ph,side,m),k=[hip[0]*.45+f[0]*.55+1.25,hip[1]*.45+f[1]*.55];c.save();c.filter=side?'brightness(.78)':'none';segment('thigh',hip,k,4.8);segment('shin',k,f,4.2);part('boot',f[0]-.5,f[1],7,4.3,.35,.42,f[2]?0:-.16*Math.sin(Math.PI*(mod(ph+side*.5)-.5)/.5)**2);c.restore();if(document.querySelector('#rig').checked){c.strokeStyle=side?'#90dcff':'#ffd982';c.lineWidth=.35;c.beginPath();c.moveTo(...hip);c.lineTo(...k);c.lineTo(f[0],f[1]);c.stroke();c.fillStyle=f[2]?'#70eea4':'#ffc16e';c.beginPath();c.arc(f[0],0,.8,0,7);c.fill()}}
function actor(x,y,scale){let m=blend,b=lift(phase)*m,headLag=(lift(phase-.035)*.72-lift(phase))*m,hip=[0,-8+b];c.save();c.translate(x,y);c.scale(scale*(flip?-1:1),scale);c.fillStyle='#10212870';c.beginPath();c.ellipse(0,1,12,2,0,0,7);c.fill();leg(phase,1,m,hip);leg(phase,0,m,hip);c.save();const lean=.025*moveX*(flip?-1:1)*m;c.translate(.65*moveX*(flip?-1:1)*m,b);c.rotate(lean);part('scarf',-5,-23,13,4,1,.4,Math.sin(phase*4*Math.PI-.8)*.09*m);part('body',0,-25,18,17,.5,0);part('arms',-5,-20,24,11,.12,.28,-lean);part('head',-2,-23+headLag,30,34,.5,1,-lean*.55+Math.sin(phase*2*Math.PI-.4)*.012*m);c.restore();c.restore()}
function label(s,x,y){c.fillStyle='#dce8e8';c.font='15px system-ui';c.textAlign='center';c.fillText(s,x,y)}
function ground(y,scale){c.strokeStyle='#607d88';c.lineWidth=1;c.beginPath();c.moveTo(35,y+2);c.lineTo(985,y+2);c.stroke();let gap=28*scale,offset=(distance*scale)%gap;for(let x=35-offset;x<985;x+=gap){c.fillStyle='#607d8870';c.fillRect(flip?1020-x:x,y+8,12*scale,2)}}
const stages=[{x:1,y:0,aim:1,name:'右へ走る / 右へ構える'},{x:1,y:0,aim:-1,name:'右へ走る / 左へ構え直す'},{x:0,y:1,aim:-1,name:'下へ移動 / 左を維持'},{x:-1,y:0,aim:-1,name:'左へ走る / 左へ構える'},{x:-1,y:0,aim:1,name:'左へ走る / 右へ構え直す'},{x:0,y:-1,aim:1,name:'上へ移動 / 右を維持'},{x:0,y:0,aim:1,name:'停止して構えを維持'}];
function draw(){c.clearRect(0,0,1020,640);c.save();c.beginPath();c.rect(25,35,970,285);c.clip();c.strokeStyle='#49616a';c.lineWidth=.6;for(let x=25;x<1020;x+=48){c.beginPath();c.moveTo(x,35);c.lineTo(x,320);c.stroke()}for(let y=35;y<=320;y+=36){c.beginPath();c.moveTo(25,y);c.lineTo(995,y);c.stroke()}if(blend>.1){c.strokeStyle='#83bdce';c.lineWidth=2;c.beginPath();c.moveTo(pos.x,pos.y+7);c.lineTo(pos.x+moveX*25,pos.y+7+moveY*25);c.stroke()}actor(pos.x,pos.y,1);c.strokeStyle='#e7c58a';c.beginPath();let aimX=pos.x+(flip?-65:65);c.moveTo(aimX-5,pos.y-21);c.lineTo(aimX+5,pos.y-21);c.moveTo(aimX,pos.y-26);c.lineTo(aimX,pos.y-16);c.stroke();c.restore();label(demo?stages[demoStage].name:'手動：WASD移動 / ポインターで左右の構え',510,24);actor(510,568,3);label('同じ姿勢を3倍表示 / '+(flip?'左向き':'右向き'),510,355);label('足の入替 0.52秒周期 / 胴体の上下動に頭が少し遅れて追従',510,615)}
function updateDemo(){demoStage=Math.floor(time/1.9)%stages.length;let q=stages[demoStage];moveX=q.x;moveY=q.y;running=Boolean(q.x||q.y);flip=q.aim<0}
function updateInput(){let dx=Number(keys.has('d')||keys.has('ArrowRight'))-Number(keys.has('a')||keys.has('ArrowLeft')),dy=Number(keys.has('s')||keys.has('ArrowDown'))-Number(keys.has('w')||keys.has('ArrowUp')),len=Math.hypot(dx,dy);running=len>0;if(len){moveX=dx/len;moveY=dy/len}if(Math.abs(pointer.x-pos.x)>6)flip=pointer.x<pos.x}
function frame(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(!paused){dt*=Number(document.querySelector('#speed').value);time+=dt;if(demo)updateDemo();else updateInput();blend+=(Number(running)-blend)*(1-Math.exp(-dt*18));phase+=dt/.52*blend;const speed=10/(.52*.50);pos.x=Math.max(65,Math.min(955,pos.x+moveX*speed*blend*dt));pos.y=Math.max(112,Math.min(297,pos.y+moveY*speed*blend*dt));}draw();requestAnimationFrame(frame)}
document.querySelector('#demo').onclick=e=>{demo=!demo;keys.clear();e.target.classList.toggle('active',demo);e.target.textContent='自動デモ：'+(demo?'ON':'OFF');cv.focus()};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'再生':'一時停止'};document.querySelector('#step').onclick=()=>{paused=true;document.querySelector('#pause').textContent='再生';phase+=.125;draw()};document.querySelector('#reset').onclick=()=>{pos={x:360,y:205};time=0;phase=0;keys.clear()};
cv.addEventListener('pointermove',e=>{let r=cv.getBoundingClientRect();pointer={x:(e.clientX-r.left)*1020/r.width,y:(e.clientY-r.top)*640/r.height}});cv.addEventListener('pointerdown',()=>cv.focus());
document.querySelector('#scene').onchange=e=>{demo=true;time=Number(e.target.value)*1.9+.25;pos={x:450,y:205};document.querySelector('#demo').textContent='自動デモ：ON';document.querySelector('#demo').classList.add('active');updateDemo();draw()};
window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;let k=e.key.length===1?e.key.toLowerCase():e.key;if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)){e.preventDefault();keys.add(k);demo=false;document.querySelector('#demo').textContent='自動デモ：OFF';document.querySelector('#demo').classList.remove('active')}});window.addEventListener('keyup',e=>keys.delete(e.key.length===1?e.key.toLowerCase():e.key));window.addEventListener('blur',()=>keys.clear());
atlas.decode().then(()=>{for(let [k,r] of Object.entries(rects))parts[k]=extract(r);document.querySelector('#status').textContent='参考動画8.5〜9.5秒付近を動作設計の参考に使用。周期や揺れ幅はリナ用の調整値で、動画の厳密な計測値ではありません。';requestAnimationFrame(frame)}).catch(e=>document.querySelector('#status').textContent='読込失敗: '+e.message);
</script></html>
